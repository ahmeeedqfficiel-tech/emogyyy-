<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد ملكي - صورة متحركة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 800px;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 50, 150, 0.5);
        }

        /* الخلفية الأسطورية المتحركة */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #0c0032, #190061, #240090, #3500d3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: 1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* النجوم المتلألئة */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* الزهور العائمة */
        .flowers-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
            overflow: hidden;
        }

        .flower {
            position: absolute;
            opacity: 0.8;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        /* الوردة المركزية */
        .center-flower {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-rose {
            position: relative;
            width: 200px;
            height: 200px;
            animation: rotateRose 40s infinite linear;
        }

        @keyframes rotateRose {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .petal {
            position: absolute;
            width: 60px;
            height: 100px;
            background: linear-gradient(to bottom, #ff66b2, #ff3385);
            border-radius: 50%;
            transform-origin: bottom center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .rose-center {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(#ffcc00, #ff9900);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            box-shadow: 0 0 20px #ff9900;
        }

        /* التاج الأسطوري */
        .crown {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 100px;
            z-index: 11;
            animation: crownGlow 3s infinite alternate;
        }

        @keyframes crownGlow {
            0% { filter: drop-shadow(0 0 5px gold); }
            100% { filter: drop-shadow(0 0 25px gold); }
        }

        .crown-base {
            position: absolute;
            width: 100%;
            height: 30px;
            background: linear-gradient(to right, #ffd700, #ffed4e, #ffd700);
            border-radius: 10px 10px 0 0;
            top: 0;
        }

        .crown-point {
            position: absolute;
            width: 30px;
            height: 50px;
            background: linear-gradient(to top, #ffd700, #ffed4e);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            bottom: 30px;
        }

        .crown-jewel {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(#ff3366, #cc0044);
            border-radius: 50%;
            top: 10px;
            box-shadow: 0 0 10px #ff3366;
        }

        /* النص الرئيسي */
        .text-container {
            position: absolute;
            width: 100%;
            top: 15%;
            text-align: center;
            z-index: 4;
        }

        .main-text {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(to right, #ff66b2, #ff3385, #ff0066);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 0, 102, 0.3);
            animation: textGlow 2s infinite alternate;
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 10px rgba(255, 0, 102, 0.3); }
            100% { text-shadow: 0 0 20px rgba(255, 0, 102, 0.7), 0 0 30px rgba(255, 0, 102, 0.5); }
        }

        .signature {
            position: absolute;
            bottom: 10%;
            right: 5%;
            font-size: 1.8rem;
            color: gold;
            font-weight: bold;
            z-index: 4;
            animation: signatureMove 5s infinite alternate;
        }

        @keyframes signatureMove {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(-10px) rotate(1deg); }
        }

        .signature::after {
            content: "👑";
            margin-right: 10px;
            font-size: 2rem;
            animation: crownBounce 2s infinite;
        }

        @keyframes crownBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* تأثيرات إضافية */
        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
            animation: sparkleMove 3s linear infinite;
        }

        @keyframes sparkleMove {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* معلومات التحكم */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .controls button {
            background: #ff3385;
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #ff0066;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الخلفية الأسطورية -->
        <div class="background"></div>
        
        <!-- النجوم -->
        <div class="stars" id="stars"></div>
        
        <!-- الزهور -->
        <div class="flowers-container" id="flowers"></div>
        
        <!-- النص -->
        <div class="text-container">
            <div class="main-text">joyeux anniversaire amiratyyy ❤️‍🩹👑</div>
        </div>
        
        <!-- التوقيع -->
        <div class="signature">Ahmeeed</div>
        
        <!-- الشرر -->
        <div class="sparkles" id="sparkles"></div>
        
        <!-- التحكم -->
        <div class="controls">
            <p>التصميم المتحرك للعيد</p>
            <button id="toggleBtn" onclick="toggleAnimation()">إيقاف/تشغيل الحركة</button>
            <button onclick="addMoreFlowers()">إضافة المزيد من الزهور</button>
        </div>
    </div>

    <script>
        // إنشاء النجوم
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                star.style.animationDelay = `${Math.random() * 5}s`;
                
                starsContainer.appendChild(star);
            }
        }
        
        // إنشاء الزهور
        function createFlowers() {
            const flowersContainer = document.getElementById('flowers');
            const flowerTypes = ['🌹', '🌺', '🌸', '🌼', '🌷', '💐', '🥀', '🌻'];
            const flowerCount = 30;
            
            for (let i = 0; i < flowerCount; i++) {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                
                const flowerType = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
                flower.innerHTML = flowerType;
                
                const size = Math.random() * 50 + 30;
                flower.style.fontSize = `${size}px`;
                
                flower.style.left = `${Math.random() * 100}%`;
                
                if (flowerType !== '🌹' && flowerType !== '🌷') {
                    const hue = Math.random() * 360;
                    flower.style.filter = `hue-rotate(${hue}deg) drop-shadow(0 0 5px rgba(255, 255, 255, 0.7))`;
                }
                
                const duration = Math.random() * 30 + 20;
                flower.style.animationDuration = `${duration}s`;
                
                flower.style.animationDelay = `${Math.random() * 10}s`;
                
                flowersContainer.appendChild(flower);
            }
        }
        
        // إنشاء بتلات الوردة المركزية
        function createRosePetals() {
            // إذا لم تكن هناك ورقة رئيسية، نخرج بدون تنفيذ أي شيء
            const mainRose = document.getElementById('mainRose');
            if (!mainRose) return;
            const petalCount = 12;
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                const angle = (360 / petalCount) * i;
                const scale = 0.8 + (i % 3) * 0.2;
                petal.style.transform = `rotate(${angle}deg) translateY(-40px) scale(${scale})`;
                const colorShift = i * 10;
                petal.style.background = `linear-gradient(to bottom, hsl(${330 + colorShift}, 100%, 70%), hsl(${330 + colorShift}, 100%, 50%))`;
                mainRose.appendChild(petal);
            }
            // طبقة داخلية (ستعمل فقط إذا وُجد mainRose)
            const innerCount = 8;
            for (let i = 0; i < innerCount; i++) {
                const innerPetal = document.createElement('div');
                innerPetal.classList.add('petal');
                innerPetal.style.width = '40px';
                innerPetal.style.height = '80px';
                const angle = (360 / innerCount) * i;
                innerPetal.style.transform = `rotate(${angle}deg) translateY(-20px) scale(0.9)`;
                innerPetal.style.background = `linear-gradient(to bottom, hsl(340, 100%, 75%), hsl(340, 100%, 60%))`;
                innerPetal.style.zIndex = '2';
                mainRose.appendChild(innerPetal);
            }
        }
        
        // إنشاء شرر متحرك
        function createSparkles() {
            const sparklesContainer = document.getElementById('sparkles');
            const sparkleCount = 50;
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                
                const size = Math.random() * 8 + 3;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.top = `${Math.random() * 100}%`;
                
                const hue = Math.random() * 360;
                sparkle.style.backgroundColor = `hsl(${hue}, 100%, 70%)`;
                
                const duration = Math.random() * 4 + 2;
                sparkle.style.animationDuration = `${duration}s`;
                
                sparkle.style.animationDelay = `${Math.random() * 5}s`;
                
                sparklesContainer.appendChild(sparkle);
            }
        }
        
        // إنشاء أزهار عند موضع النقر داخل الحاوية
        function spawnFlowersAt(clientX, clientY, count = 6) {
            const flowersContainer = document.getElementById('flowers');
            if (!flowersContainer) return;

            const rect = flowersContainer.getBoundingClientRect();
            const localX = clientX - rect.left;
            const localY = clientY - rect.top;

            const flowerTypes = ['🌹', '🌺', '🌸', '🌼', '🌷', '💐', '🥀', '🌻'];

            for (let i = 0; i < count; i++) {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                const flowerType = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
                flower.innerHTML = flowerType;

                const size = Math.random() * 36 + 14; // حجم معقول للنقطة
                flower.style.fontSize = `${size}px`;

                // تمركز الزهرة عند نقطة النقر مع إزاحة عشوائية طفيفة
                const jitterX = (Math.random() - 0.5) * 60; // -30..30
                const jitterY = (Math.random() - 0.5) * 60;
                flower.style.left = `${localX + jitterX}px`;
                flower.style.top = `${localY + jitterY}px`;
                flower.style.marginLeft = `${-size / 2}px`;
                flower.style.marginTop = `${-size / 2}px`;

                if (flowerType !== '🌹' && flowerType !== '🌷') {
                    const hue = Math.random() * 360;
                    flower.style.filter = `hue-rotate(${hue}deg) drop-shadow(0 0 5px rgba(255,255,255,0.7))`;
                }

                const duration = Math.random() * 18 + 8;
                flower.style.animationDuration = `${duration}s`;
                flower.style.animationDelay = `${Math.random() * 0.6}s`;

                flowersContainer.appendChild(flower);
            }
        }
        
        // تبديل الحركة (إيقاف/تشغيل)
        function toggleAnimation() {
            const animatedElements = document.querySelectorAll('.flower, .main-rose, .star, .sparkle, .main-text, .signature');
            if (animatedElements.length === 0) return;
            const isPaused = getComputedStyle(animatedElements[0]).animationPlayState === 'paused';
            
            animatedElements.forEach(el => {
                el.style.animationPlayState = isPaused ? 'running' : 'paused';
            });
            
            const button = document.getElementById('toggleBtn');
            button.textContent = isPaused ? 'إيقاف الحركة' : 'تشغيل الحركة';
        }
        
        // إضافة المزيد من الزهور
        function addMoreFlowers() {
            const flowersContainer = document.getElementById('flowers');
            const flowerTypes = ['🌹', '🌺', '🌸', '🌼', '🌷', '💐', '🥀', '🌻'];
            
            for (let i = 0; i < 10; i++) {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                
                const flowerType = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
                flower.innerHTML = flowerType;
                
                const size = Math.random() * 50 + 30;
                flower.style.fontSize = `${size}px`;
                
                flower.style.left = `${Math.random() * 100}%`;
                
                if (flowerType !== '🌹' && flowerType !== '🌷') {
                    const hue = Math.random() * 360;
                    flower.style.filter = `hue-rotate(${hue}deg) drop-shadow(0 0 5px rgba(255, 255, 255, 0.7))`;
                }
                
                const duration = Math.random() * 30 + 20;
                flower.style.animationDuration = `${duration}s`;
                
                flower.style.animationDelay = `${Math.random() * 5}s`;
                
                flowersContainer.appendChild(flower);
            }
        }
        
        // تهيئة الصفحة عند التحميل
        window.onload = function() {
            createStars();
            createFlowers();
            createSparkles();

            // تفعيل مستمعي الأحداث فقط إن وُجدت العناصر (الوردة/التاج قد تكون أُزيلت)
            const mainRose = document.getElementById('mainRose');
            if (mainRose) {
                mainRose.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.2)';
                    this.style.transition = 'transform 0.5s';
                });
                mainRose.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                });
            }
            const crown = document.querySelector('.crown');
            if (crown) {
                crown.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateX(-50%) scale(1.2)';
                    this.style.transition = 'transform 0.5s';
                });
                crown.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateX(-50%)';
                });
            }

            // حدث النقر لإنتاج أزهار في موضع النقر (تجاهل النقر داخل عناصر التحكم)
            const container = document.querySelector('.container');
            if (container) {
                container.addEventListener('click', function(e) {
                    if (e.target.closest('.controls')) return;
                    // استخدام إحداثيات النقر على الشاشة
                    spawnFlowersAt(e.clientX, e.clientY, 8);
                });

                // دعم اللمس (اختياري)
                container.addEventListener('touchstart', function(e) {
                    if (e.target.closest('.controls')) return;
                    const touch = e.touches[0];
                    if (touch) spawnFlowersAt(touch.clientX, touch.clientY, 6);
                });
            }
        };
    </script>
</body>
</html>
