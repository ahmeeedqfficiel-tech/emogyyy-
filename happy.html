<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلادة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
</head>
<body>
    <div class="container">
        <!-- الخلفية الأسطورية -->
        <div class="background"></div>
        
        <!-- النجوم -->
        <div class="stars" id="stars"></div>
        
        <!-- الزهور -->
        <div class="flowers-container" id="flowers"></div>
        
        <!-- النص -->
        <div class="text-container">
            <div class="main-text">joyeux anniversaire amiratyyy ❤️‍🩹👑</div>
        </div>
        
        <!-- التوقيع -->
        <div class="signature">Ahmeeed</div>
        
        <!-- الشرر -->
        <div class="sparkles" id="sparkles"></div>
        
        <!-- التحكم -->
        <div class="controls">
            <p>التصميم المتحرك للعيد</p>
            <button id="toggleBtn" onclick="toggleAnimation()">إيقاف/تشغيل الحركة</button>
            <button onclick="addMoreFlowers()">إضافة المزيد من الزهور</button>
        </div>
    </div>

    
</body>
</html>
